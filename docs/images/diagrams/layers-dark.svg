<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 406" width="600" height="406" role="img" aria-labelledby="t d"><title id="t">Module layering</title><desc id="d">RillUI sits on top and is the only product that imports SwiftUI. Below it, a Foundation-only tier holds RillCore, RillMath and RillAnalytics. RillCore also depends on RillAnalytics.</desc>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d4753"/></marker></defs>
<text x="74" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Four layered products</text>
<rect x="58" y="142" width="484" height="220" rx="9" fill="#11161d" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="74" y="52" width="452" height="56" rx="7" fill="#26160f" stroke="#d95926" stroke-width="1.4"/>
<text x="90" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e8703f">RillUI</text>
<text x="90" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a7b2c0">SwiftUI &#183; views, theming, math, syntax highlighting</text>
<line x1="300.0" y1="108" x2="300.0" y2="136" stroke="#3d4753" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="312.0" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7d8590">depends on</text>
<rect x="74" y="182" width="452" height="50" rx="6" fill="#161b22" stroke="#8494a8" stroke-width="1"/>
<text x="90" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e6edf3">RillCore</text>
<text x="90" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a7b2c0">AST + incremental parser</text>
<rect x="74" y="240" width="452" height="50" rx="6" fill="#161b22" stroke="#8494a8" stroke-width="1"/>
<text x="90" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e6edf3">RillMath</text>
<text x="90" y="279" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a7b2c0">LaTeX tokenizer + box layout</text>
<rect x="74" y="298" width="452" height="50" rx="6" fill="#161b22" stroke="#8494a8" stroke-width="1"/>
<text x="90" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e6edf3">RillAnalytics</text>
<text x="90" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a7b2c0">metrics, protocol, sinks</text>
<text x="72" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#7d8590">FOUNDATION ONLY &#183; NEVER IMPORTS SWIFTUI OR UIKIT</text>
<text x="74" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7d8590">RillCore depends on RillAnalytics, so RillCore alone still pulls it in.</text>
</svg>
