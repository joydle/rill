<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 265" width="790" height="265" role="img" aria-labelledby="t d"><title id="t">The commit boundary</title><desc id="d">Four closed Markdown blocks left of commitIndex are frozen and reused; the open paragraph to its right is the dirty tail, the only region re-lexed on each delta.</desc>
